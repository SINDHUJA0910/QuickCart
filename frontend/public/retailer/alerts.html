<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Alerts — QuickCart Retailer</title>
<meta name="quickcart-api-base" content="http://localhost:8000/api/v1">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .alert-card { display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--line); }
  .alert-card:last-child { border-bottom: none; }
  .alert-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--red-tint); color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .alert-meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .alert-actions { display: flex; gap: 8px; margin-top: 10px; }
  .status-filter-chips { display: flex; gap: 8px; margin-bottom: 18px; }
</style>
</head>
<body>

<div class="retailer-shell">
  <div class="retailer-topbar" id="retailerTopbar"></div>
  <main class="retailer-main">
    <div id="retailerTabs"></div>
    <div id="content">
      <div class="skeleton" style="height:200px; border-radius:14px;"></div>
    </div>
  </main>
</div>

<script type="module">
  import { api, ApiError } from '../assets/js/api-client.js';
  import { resolveCurrentStore } from '../assets/js/retailer-context.js';
  import { renderRetailerShell } from '../assets/js/retailer-shell.js';
  import { showToast } from '../assets/js/ui.js';

  const content = document.getElementById('content');
  let currentStoreId = null;
  let activeStatus = 'open';

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  async function init() {
    const { store, allStores } = await resolveCurrentStore();
    if (!store) { window.location.href = './store-setup.html'; return; }
    currentStoreId = store.id;
    renderRetailerShell({ activeTab: 'alerts.html', store, allStores });

    content.innerHTML = `
      <h1 class="page-title" style="font-size:30px; margin-bottom:16px;">AI theft alerts</h1>
      <div class="status-filter-chips">
        <button class="chip active" data-status="open">Open</button>
        <button class="chip" data-status="resolved">Resolved</button>
        <button class="chip" data-status="false_positive">False positive</button>
      </div>
      <div class="table-wrap" id="alertsList"><div class="skeleton" style="height:160px;"></div></div>
    `;

    content.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        content.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeStatus = chip.dataset.status;
        renderAlerts();
      });
    });

    await renderAlerts();
  }

  async function renderAlerts() {
    const listEl = document.getElementById('alertsList');
    try {
      const alerts = await api.listAlerts(currentStoreId, activeStatus);
      if (alerts.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><div class="icon">&#128737;</div><p>No ${activeStatus.replace('_', ' ')} alerts.</p></div>`;
        return;
      }
      listEl.innerHTML = alerts.map(a => `
        <div class="alert-card">
          <div class="alert-icon">&#9888;</div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div>
                <span class="severity-badge ${a.severity}">${a.severity}</span>
                <div style="font-weight:600; font-size:14.5px; margin-top:6px;">${escapeHtml(a.reason.replace(/_/g, ' '))}</div>
              </div>
              <span class="alert-meta">${timeAgo(a.detected_at)}</span>
            </div>
            <div class="alert-meta">${a.camera_id ? `Camera ${a.camera_id.slice(0, 8)}` : 'No camera linked'} ${a.session_id ? `&middot; Session ${a.session_id.slice(0, 8)}` : ''}</div>
            ${activeStatus === 'open' ? `
              <div class="alert-actions">
                <button class="btn btn-primary btn-sm resolve-btn" data-id="${a.id}">Mark resolved</button>
                <button class="btn btn-ghost btn-sm false-positive-btn" data-id="${a.id}">False positive</button>
              </div>` : ''}
          </div>
        </div>
      `).join('');

      listEl.querySelectorAll('.resolve-btn').forEach(btn => btn.addEventListener('click', () => resolve(btn.dataset.id, 'resolved')));
      listEl.querySelectorAll('.false-positive-btn').forEach(btn => btn.addEventListener('click', () => resolve(btn.dataset.id, 'false_positive')));
    } catch (err) {
      listEl.innerHTML = `<div class="banner banner-error">Could not load alerts.</div>`;
    }
  }

  async function resolve(alertId, status) {
    try {
      await api.resolveAlert(currentStoreId, alertId, status);
      showToast('Alert updated', 'success');
      renderAlerts();
    } catch (err) {
      showToast((err instanceof ApiError && err.detail) || 'Could not update alert.', 'error');
    }
  }

  init();
</script>

</body>
</html>
