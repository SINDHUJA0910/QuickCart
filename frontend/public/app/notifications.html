<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Alerts — QuickCart</title>
<meta name="quickcart-api-base" content="http://localhost:8000/api/v1">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .notif-item { display: flex; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--green-tint); }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-top: 6px; flex-shrink: 0; }
  .notif-item.read .notif-dot { visibility: hidden; }
  .notif-title { font-weight: 600; font-size: 14px; }
  .notif-body { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .notif-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <span class="topbar-title">Alerts</span>
    <button class="theme-toggle" aria-label="Toggle dark mode"></button>
  </div>

  <main class="app-main" style="padding: 0;" id="mainContent">
    <div style="padding: 20px 20px 0;">
      <div class="skeleton" style="width:100%;height:60px;margin-bottom:8px;border-radius:12px;"></div>
      <div class="skeleton" style="width:100%;height:60px;border-radius:12px;"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="./stores.html"><span class="nav-icon">&#127978;</span>Stores</a>
    <a href="./notifications.html" class="active"><span class="nav-icon">&#128276;</span>Alerts</a>
    <a href="./account.html"><span class="nav-icon">&#128100;</span>Account</a>
  </nav>
</div>

<script type="module">
  import { api, isLoggedIn } from '../assets/js/api-client.js';
  import { initTheme } from '../assets/js/ui.js';

  initTheme();
  if (!isLoggedIn()) window.location.href = './login.html';

  const mainContent = document.getElementById('mainContent');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  async function load() {
    try {
      const notifications = await api.listNotifications();
      if (notifications.length === 0) {
        mainContent.innerHTML = `<div class="empty-state"><div class="icon">&#128276;</div><p>No notifications yet.</p></div>`;
        return;
      }
      mainContent.innerHTML = notifications.map(n => `
        <div class="notif-item ${n.read ? 'read' : 'unread'}" data-id="${n.id}">
          <div class="notif-dot"></div>
          <div style="flex:1;">
            <div class="notif-title">${escapeHtml(n.title)}</div>
            ${n.body ? `<div class="notif-body">${escapeHtml(n.body)}</div>` : ''}
            <div class="notif-time">${timeAgo(n.created_at)}</div>
          </div>
        </div>
      `).join('');

      mainContent.querySelectorAll('.notif-item.unread').forEach(el => {
        el.addEventListener('click', async () => {
          try {
            await api.markNotificationRead(el.dataset.id);
            el.classList.remove('unread');
            el.classList.add('read');
          } catch {}
        });
      });
    } catch (err) {
      mainContent.innerHTML = `<div class="banner banner-error">Could not load notifications.</div>`;
    }
  }

  load();
</script>

</body>
</html>
