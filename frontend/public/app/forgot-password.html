<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset password — QuickCart</title>
<meta name="quickcart-api-base" content="http://localhost:8000/api/v1">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div class="centered-shell">
  <div style="width: 100%; max-width: 400px;">
    <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 32px;">
      <a href="../index.html" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-family:'Bebas Neue',sans-serif; font-size:24px;">
        <span class="logo-mark" aria-hidden="true"></span>QuickCart
      </a>
      <button class="theme-toggle" aria-label="Toggle dark mode"></button>
    </div>

    <span class="eyebrow">Password reset</span>
    <h1 class="page-title">Reset your password</h1>
    <p class="page-sub">Enter your account email and we'll send you a reset link.</p>

    <div class="role-toggle">
      <button type="button" class="active" data-role="customer">Shopper</button>
      <button type="button" data-role="retailer">Retailer</button>
    </div>

    <div class="banner banner-error hidden" id="errorBanner" role="alert"></div>
    <div class="banner banner-success hidden" id="successBanner" role="status">Check your email for a reset link.</div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
    </form>

    <p class="form-footer-link"><a href="./login.html">Back to sign in</a></p>
  </div>
</div>

<script type="module">
  import { api, ApiError } from '../assets/js/api-client.js';
  import { initTheme, setButtonLoading } from '../assets/js/ui.js';

  initTheme();

  let selectedRole = 'customer';
  document.querySelectorAll('.role-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedRole = btn.dataset.role;
    });
  });

  const form = document.getElementById('resetForm');
  const errorBanner = document.getElementById('errorBanner');
  const successBanner = document.getElementById('successBanner');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.add('hidden');
    successBanner.classList.add('hidden');

    const email = document.getElementById('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorBanner.textContent = 'Enter a valid email address.';
      errorBanner.classList.remove('hidden');
      return;
    }

    setButtonLoading(submitBtn, true, 'Sending…');
    try {
      const fn = selectedRole === 'retailer' ? api.retailerForgotPassword : api.customerForgotPassword;
      await fn({ email });
      form.style.display = 'none';
      successBanner.classList.remove('hidden');
    } catch (err) {
      errorBanner.textContent = (err instanceof ApiError && err.detail) || 'Could not send reset email.';
      errorBanner.classList.remove('hidden');
    } finally {
      setButtonLoading(submitBtn, false);
    }
  });
</script>

</body>
</html>
