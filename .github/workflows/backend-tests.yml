name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU-only torch first
        # Same rationale as the Dockerfile: avoids pulling multi-GB CUDA
        # packages in CI, which would slow every run for no benefit since
        # these tests never touch a GPU.
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Fake credentials — every test in this suite runs against the
          # FakeServiceClient fixture (tests/fake_supabase.py) or
          # MagicMock-based fixtures, never a real Supabase project. See
          # tests/conftest.py for how these are wired.
          SUPABASE_URL: https://ci-fake.supabase.co
          SUPABASE_ANON_KEY: ci-fake-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-fake-service-key
          SUPABASE_JWT_SECRET: ci-fake-jwt-secret
          RAZORPAY_KEY_ID: ci-fake-razorpay-id
          RAZORPAY_KEY_SECRET: ci-fake-razorpay-secret
          QR_ENCRYPTION_KEY: n9ARrZuU2bzI5fBJxK2tbYicDgribrjVKvgm3A-9_aY=
          ADMIN_API_KEY: ci-fake-admin-key
        run: pytest tests/ -v
